name: Replay spec changes

# Rebuild historical spec-change manifests with the CURRENT main-branch
# analyzer, policy, and manifest builder. This is intentionally separate from
# the push-triggered producer so repairing historical rows cannot change normal
# recording behavior.

run-name: Replay spec changes (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      target_shas:
        description: 'Full 40-character merge SHAs, separated by commas or spaces'
        required: true
        type: string
      mode:
        description: Preview manifests, or upload them as an artifact the SDK bot pulls into its D1
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - upload

concurrency:
  # Share the producer's concurrency group so a replay cannot race a normal
  # spec-change delivery. Every requested SHA is processed sequentially.
  group: spec-changes
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Configure Socket Firewall
        uses: workos/setup-socket-firewall@ca93dd8aa351f54f4729fe3377a9be23c631c25d # v1
        with:
          token: ${{ secrets.PUBLIC_SOCKET_FIREWALL_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build current policy module
        # Historical commits provide only the two spec snapshots. The replay
        # script deliberately imports policy and analysis code from this
        # current checkout.
        run: npm run build:policy

      - name: Preview rebuilt manifests
        if: inputs.mode == 'dry-run'
        env:
          TARGET_SHAS: ${{ inputs.target_shas }}
        run: |
          node scripts/replay-spec-changes.mjs \
            --shas "$TARGET_SHAS" \
            --repository "$GITHUB_REPOSITORY"

      - name: Verify push runs from the default branch
        if: inputs.mode == 'upload'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Upload replays must run from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Rebuild manifests for upload
        if: inputs.mode == 'upload'
        env:
          TARGET_SHAS: ${{ inputs.target_shas }}
        run: |
          node scripts/replay-spec-changes.mjs \
            --shas "$TARGET_SHAS" \
            --repository "$GITHUB_REPOSITORY" \
            --output-dir spec-changes \
            --confirm REPLAY_SPEC_CHANGES

      - name: Publish manifest artifact for the SDK bot
        # The bot pulls this on the workflow_run webhook for this run and
        # upserts each manifest by sha. Targets with no changed services write
        # nothing, so an empty directory is not an error.
        if: inputs.mode == 'upload'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spec-changes-replay-${{ github.run_id }}
          path: spec-changes/
          if-no-files-found: ignore
          retention-days: 14
