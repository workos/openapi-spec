name: Publish OpenAPI Spec to npm

on:
  push:
    branches: [main]
    paths:
      - 'spec/open-api-spec.yaml'
      - 'src/policy/**'
      - 'operationOverrides.node.json'
      - 'tsdown.config.ts'
      # The services roster (dist/services) is generated by this script and
      # bundled by tsdown. A fix to its logic alone must republish. Do NOT add
      # package.json/package-lock.json here: the publish job commits those back
      # to main via the App token, which would re-trigger this workflow in a loop.
      - 'scripts/generate-services.mjs'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        default: 'minor'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-spec
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Bump version
        id: version
        run: |
          set -euo pipefail
          bump="${{ github.event.inputs.bump || 'minor' }}"
          manifest="$(node -p "require('./package.json').version")"
          set +e
          view_out="$(npm view "$(node -p "require('./package.json').name")" version 2>&1)"
          view_rc=$?
          set -e
          if [ "$view_rc" -eq 0 ]; then
            published="$view_out"
          elif grep -q E404 <<< "$view_out"; then
            # Never published: the manifest is the only source of truth.
            published="0.0.0"
          else
            # A transient registry error must not silently fall back to a
            # possibly-stale manifest base; fail here and let a re-run heal.
            echo "$view_out"
            echo "::error::npm registry lookup failed; refusing to derive a version base"
            exit 1
          fi
          newer="$(printf '%s\n%s\n' "$manifest" "$published" | sort -V | tail -n1)"
          if [ "$manifest" = "$newer" ] && [ "$manifest" != "$published" ]; then
            # Manifest ahead of the registry: a prior run committed this bump
            # but died before publishing. Finish that release instead of
            # bumping past it — the requested bump type is deliberately
            # ignored; it was already applied when this version landed.
            next="$manifest"
          else
            # In sync, or the registry is ahead because a prior run published
            # but lost the race to commit the bump back (see #99/#114): bump
            # from the published version so a stale manifest can't wedge
            # publishing.
            npm version "$published" --no-git-tag-version --allow-same-version
            npm version "$bump" --no-git-tag-version
            next="$(node -p "require('./package.json').version")"
          fi
          echo "current=$published" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Bump: $bump | manifest=$manifest published=$published → $next"

      - name: Commit and push version bump
        run: |
          set -euo pipefail
          git config user.name "workos-sdk-automation[bot]"
          git config user.email "255426317+workos-sdk-automation[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: release v${{ steps.version.outputs.next }}"
          # The bump lands on main before npm publish so a lost race fails
          # while nothing has been published yet. A merge landing mid-run
          # rejects the push as non-fast-forward (see #99/#114); the bump
          # commit only touches package files, so rebasing onto the new tip
          # is safe, and the build below runs from the rebased tree — the
          # published artifact always matches the tagged commit. If publish
          # later fails, re-running the workflow self-repairs: the rebase
          # dedups the already-landed bump and publishes the version main
          # already records.
          for attempt in 1 2 3; do
            if git push origin main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          git push origin main

      - name: Build policy module
        run: npm run build:policy

      - name: Generate TypeScript types
        run: |
          set -euo pipefail
          mkdir -p dist
          npx -y openapi-typescript@7 spec/open-api-spec.yaml -o dist/types.d.ts

      - name: Stage dist assets
        run: |
          set -euo pipefail
          cp spec/open-api-spec.yaml dist/
          cp operationOverrides.node.json dist/

      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Tag release
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.next }}"
          # HEAD is the pushed bump commit: tag, manifest, and npm artifact
          # agree even when the rebase folded in a mid-run merge.
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: v${{ steps.version.outputs.next }}
          VERSION: ${{ steps.version.outputs.next }}
          PREVIOUS: v${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          {
            echo "Published [\`@workos/openapi-spec@${VERSION}\`](https://www.npmjs.com/package/@workos/openapi-spec/v/${VERSION}) to npm."
            echo
            echo "**Changes:** [\`${PREVIOUS}...${TAG}\`](https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS}...${TAG})"
          } > "$notes_file"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$notes_file" \
            spec/open-api-spec.yaml

      # Downstream notification. Deliberately last and non-fatal: by this point
      # the version is published, tagged, and announced, so nothing here is
      # allowed to fail a release that already happened. The cost is that a
      # missed notification is quiet — hence the warnings below, and the
      # workflow_dispatch hatch on the consumer's side.
      #
      # Needs its own token: create-github-app-token scopes the job's existing
      # one to this repo.
      - name: Generate token for sdk-automation-bot
        id: bot-token
        continue-on-error: true
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ vars.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          owner: workos
          repositories: sdk-automation-bot
          permission-contents: write

      - name: Notify sdk-automation-bot
        # The bot bundles our `services` roster and alias map at build time, so
        # it keeps shipping a stale copy until something moves its lockfile — a
        # dropped alias there surfaces a raw tag as a stageable row whose
        # generation then fails. It listens for this event and bumps itself; we
        # only announce, and stay ignorant of what it does about it.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::no token for sdk-automation-bot (is the app installed there with contents:write?); skipped notify for v${VERSION}"
            exit 1
          fi
          if ! gh api "repos/workos/sdk-automation-bot/dispatches" \
                 -f "event_type=openapi-spec-released" \
                 -f "client_payload[version]=${VERSION}"; then
            echo "::warning::could not notify sdk-automation-bot of v${VERSION}; run its 'Bump openapi-spec' workflow manually to catch up"
            exit 1
          fi
          echo "Notified sdk-automation-bot of v${VERSION}."
